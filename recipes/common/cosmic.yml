modules:
  - type: dnf
    # Add COSMIC Nightly Copr Repository
    repos:
      cleanup: true
      copr:
        - ryanabx/cosmic-epoch
    install:
      install-weak-deps: false
      packages:       
        # Install COSMIC Packages
        - cosmic-app-library
        - cosmic-applets
        - cosmic-bg
        - cosmic-comp
        - cosmic-edit
        - cosmic-files
        - cosmic-greeter
        - cosmic-icon-theme
        - cosmic-idle
        - cosmic-initial-setup
        - cosmic-launcher
        - cosmic-monitor
        - cosmic-notifications
        - cosmic-osd
        - cosmic-osk
        - cosmic-panel
        - cosmic-player
        - cosmic-randr
        - cosmic-screenshot
        - cosmic-session
        - cosmic-settings
        - cosmic-settings-daemon
        - cosmic-store
        - cosmic-term
        - cosmic-viewer
        - cosmic-wallpapers
        - cosmic-workspaces
        - xdg-desktop-portal-cosmic
        - pop-launcher
